<svg xmlns="http://www.w3.org/2000/svg" width="80mm" height="120mm" viewBox="0 0 80 120">
  <!-- Thẻ treo (hang tag) Combo Quà Tết - đúng phong cách "Mộc & Thật" của nhan-say-day-*.svg -->
  <!-- Dùng cho cả 2 gói (nhỏ: Cam 5kg+Sắn dây 0.5kg / lớn: Cam 10kg+Sắn dây 1kg) - không in giá -->
  <!-- cố định (giá chưa chốt + có thể đổi), chừa dòng trống để viết tay gói + giá khi bán. -->

  <rect x="0" y="0" width="80" height="120" rx="3" fill="#c9a877"/>
  <rect x="1.2" y="1.2" width="77.6" height="117.6" rx="2.2" fill="none" stroke="#3e2e10" stroke-width="0.3" opacity="0.4"/>

  <!-- Lỗ treo dây (đục lỗ thật, chỉ vẽ viền để thợ in biết vị trí đục) -->
  <circle cx="40" cy="8" r="2.2" fill="#ffffff" fill-opacity="0.25" stroke="#3e2e10" stroke-width="0.35" opacity="0.6"/>

  <!-- Logo tròn (giống hệt nhan-say-day-*.svg, scale nhỏ lại cho thẻ hẹp) -->
  <g transform="translate(25,14) scale(0.061)">
    <defs>
      <clipPath id="logoRingClipTag">
        <circle cx="250" cy="250" r="244"/>
      </clipPath>
    </defs>
    <g clip-path="url(#logoRingClipTag)">
      <circle cx="250" cy="150" r="98" fill="#e8a33c" opacity="0.08"/>
      <circle cx="250" cy="150" r="92" fill="#e8a33c" opacity="0.12"/>
      <circle cx="250" cy="150" r="68" fill="#e8a33c" opacity="0.2"/>
      <circle cx="250" cy="150" r="46" fill="#eaa63f"/>
      <circle cx="250" cy="150" r="46" fill="#f5c877" opacity="0.4"/>
      <circle cx="250" cy="150" r="48" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.85"/>
      <path d="M6,205 C34,178 50,168 66,182 C82,160 104,150 124,168 C140,146 158,138 178,154 C196,134 220,128 240,146 C258,128 282,124 302,142 C322,124 348,122 366,140 C386,122 412,126 430,144 C448,128 472,130 494,146 L494,215 L6,215 Z" fill="#c9d6bc" opacity="0.7"/>
      <path d="M6,222 C30,196 46,188 62,200 C74,168 92,150 112,164 C130,180 146,192 168,182 C188,164 206,148 228,158 C248,176 262,196 284,188 C304,168 320,152 342,162 C362,182 378,200 400,192 C420,172 438,156 458,166 C474,182 486,196 494,198 L494,234 L6,234 Z" fill="#a9c096" opacity="0.85"/>
      <path d="M6,248 C32,214 52,202 74,216 C90,178 112,152 138,168 C156,190 168,208 190,200 C212,176 232,158 256,170 C276,192 288,212 310,206 C332,182 350,162 374,174 C394,198 406,218 428,212 C446,190 462,172 482,182 C490,190 493,192 494,194 L494,258 L6,258 Z" fill="#87a570"/>
      <path d="M6,268 C36,238 60,228 84,244 C104,220 128,206 152,222 C174,244 188,258 210,250 C234,226 256,212 280,226 C300,246 314,262 336,256 C358,234 378,218 402,230 C422,250 436,264 458,258 C474,244 486,236 494,238 L494,282 L6,282 Z" fill="#5f8050"/>
      <path d="M6,290 C38,244 66,230 96,252 C120,222 148,200 178,222 C202,248 216,266 240,256 C268,224 292,204 320,224 C344,250 360,270 384,262 C408,232 428,212 452,228 C470,248 484,266 494,270 L494,306 L6,306 Z" fill="#39533a"/>
    </g>
    <circle cx="250" cy="250" r="244" fill="none" stroke="#3d5c34" stroke-width="4"/>
  </g>

  <!-- Tiêu đề -->
  <text x="40" y="49" font-family="Cambria, Georgia, serif" font-weight="500" font-size="6" letter-spacing="0.2" fill="#2e4630" text-anchor="middle">QUÀ TẾT NHÀ LÀM</text>
  <text x="40" y="55" font-family="Cambria, Georgia, serif" font-style="italic" font-size="3.4" fill="#5b4a2a" text-anchor="middle">Nông Sản Nhà Làm &#183; Lạng Sơn</text>
  <line x1="12" y1="59" x2="68" y2="59" stroke="#2e4630" stroke-width="0.3" opacity="0.55"/>

  <!-- Nội dung gồm gì (dùng chung 2 gói, không nêu cụ thể kg/giá ở đây) -->
  <text x="40" y="66" font-family="Arial, sans-serif" font-size="3" fill="#3a2f18" text-anchor="middle">Cam Đường Canh (VietGAP)</text>
  <text x="40" y="70.6" font-family="Arial, sans-serif" font-size="3" fill="#3a2f18" text-anchor="middle">+ Tinh Bột Sắn Dây thủ công</text>

  <!-- Dòng viết tay: gói + giá, đổi được theo từng mùa/đợt giá mà không cần in lại thẻ khác -->
  <line x1="12" y1="79" x2="68" y2="79" stroke="#3a2f18" stroke-width="0.25" opacity="0.5"/>
  <text x="14" y="77.4" font-family="Arial, sans-serif" font-size="2.6" fill="#5b4a2a">Gói:</text>
  <line x1="12" y1="87" x2="68" y2="87" stroke="#3a2f18" stroke-width="0.25" opacity="0.5"/>
  <text x="14" y="85.4" font-family="Arial, sans-serif" font-size="2.6" fill="#5b4a2a">Giá:</text>

  <!-- Lời chúc ngắn -->
  <text x="40" y="96" font-family="Cambria, Georgia, serif" font-style="italic" font-size="3" fill="#2e4630" text-anchor="middle">Chúc năm mới an khang,</text>
  <text x="40" y="100.4" font-family="Cambria, Georgia, serif" font-style="italic" font-size="3" fill="#2e4630" text-anchor="middle">nhà nhà sung túc!</text>

  <line x1="12" y1="105" x2="68" y2="105" stroke="#2e4630" stroke-width="0.3" opacity="0.4"/>

  <!-- Liên hệ -->
  <text x="40" y="111" font-family="Arial, sans-serif" font-size="2.6" fill="#3a2f18" text-anchor="middle">Zalo: 0979 502 000</text>
  <text x="40" y="115.4" font-family="Arial, sans-serif" font-size="2.6" fill="#3a2f18" text-anchor="middle">nongsannhalam.com</text>
</svg>
