<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="150mm" viewBox="0 0 100 150">
  <!-- Thiệp chúc Tết - mặt trước in sẵn, đúng phong cách "Mộc & Thật". Mặt sau CHỦ ĐỊNH để trống
  (giấy trơn, không in gì) để viết tay lời nhắn riêng cho từng khách - đúng tinh thần "thiệp viết
  tay" đã nhắc trong CHIEN_DICH_TET_2027.md, khác với thẻ treo the-qua-tet.svg (in sẵn lời chúc
  chung cho mọi khách). Khổ 100x150mm - cỡ bưu thiếp phổ thông, dễ đặt in, không cần khổ riêng. -->

  <rect x="0" y="0" width="100" height="150" fill="#c9a877"/>
  <rect x="1.5" y="1.5" width="97" height="147" fill="none" stroke="#3e2e10" stroke-width="0.3" opacity="0.4"/>

  <!-- Logo tròn, đặt cao hơn giữa trang để chừa khoảng trống phía dưới -->
  <g transform="translate(29,16) scale(0.086)">
    <defs>
      <clipPath id="logoRingClipCard">
        <circle cx="250" cy="250" r="244"/>
      </clipPath>
    </defs>
    <g clip-path="url(#logoRingClipCard)">
      <circle cx="250" cy="150" r="98" fill="#e8a33c" opacity="0.08"/>
      <circle cx="250" cy="150" r="92" fill="#e8a33c" opacity="0.12"/>
      <circle cx="250" cy="150" r="68" fill="#e8a33c" opacity="0.2"/>
      <circle cx="250" cy="150" r="46" fill="#eaa63f"/>
      <circle cx="250" cy="150" r="46" fill="#f5c877" opacity="0.4"/>
      <circle cx="250" cy="150" r="48" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.85"/>
      <path d="M6,205 C34,178 50,168 66,182 C82,160 104,150 124,168 C140,146 158,138 178,154 C196,134 220,128 240,146 C258,128 282,124 302,142 C322,124 348,122 366,140 C386,122 412,126 430,144 C448,128 472,130 494,146 L494,215 L6,215 Z" fill="#c9d6bc" opacity="0.7"/>
      <path d="M6,222 C30,196 46,188 62,200 C74,168 92,150 112,164 C130,180 146,192 168,182 C188,164 206,148 228,158 C248,176 262,196 284,188 C304,168 320,152 342,162 C362,182 378,200 400,192 C420,172 438,156 458,166 C474,182 486,196 494,198 L494,234 L6,234 Z" fill="#a9c096" opacity="0.85"/>
      <path d="M6,248 C32,214 52,202 74,216 C90,178 112,152 138,168 C156,190 168,208 190,200 C212,176 232,158 256,170 C276,192 288,212 310,206 C332,182 350,162 374,174 C394,198 406,218 428,212 C446,190 462,172 482,182 C490,190 493,192 494,194 L494,258 L6,258 Z" fill="#87a570"/>
      <path d="M6,268 C36,238 60,228 84,244 C104,220 128,206 152,222 C174,244 188,258 210,250 C234,226 256,212 280,226 C300,246 314,262 336,256 C358,234 378,218 402,230 C422,250 436,264 458,258 C474,244 486,236 494,238 L494,282 L6,282 Z" fill="#5f8050"/>
      <path d="M6,290 C38,244 66,230 96,252 C120,222 148,200 178,222 C202,248 216,266 240,256 C268,224 292,204 320,224 C344,250 360,270 384,262 C408,232 428,212 452,228 C470,248 484,266 494,270 L494,306 L6,306 Z" fill="#39533a"/>
    </g>
    <circle cx="250" cy="250" r="244" fill="none" stroke="#3d5c34" stroke-width="4"/>
  </g>

  <!-- Tiêu đề (đẩy xuống y=68, chừa khoảng cách rõ với đáy logo ở y~58, tránh đè chữ) -->
  <text x="50" y="68" font-family="Cambria, Georgia, serif" font-weight="500" font-size="7.5" letter-spacing="0.3" fill="#2e4630" text-anchor="middle">CHÚC MỪNG NĂM MỚI</text>
  <text x="50" y="75" font-family="Cambria, Georgia, serif" font-style="italic" font-size="4" fill="#5b4a2a" text-anchor="middle">Nông Sản Nhà Làm &#183; Lạng Sơn</text>

  <line x1="20" y1="81" x2="80" y2="81" stroke="#2e4630" stroke-width="0.3" opacity="0.5"/>

  <!-- Lời ngắn in sẵn - KHÔNG viết lời nhắn cá nhân ở đây, để trống phần lớn trang cho mặt sau viết tay.
  Font Cambria (không phải Georgia) cho chữ nghiêng - Georgia trên máy này lỗi hiển thị các chữ có dấu
  "â" + thanh điệu (ấ/ầ/ẩ/ẫ/ậ), đã test xác nhận Cambria/Times/Arial đều hiển thị đúng, chỉ Georgia sai. -->
  <text x="50" y="89" font-family="Cambria, Georgia, serif" font-style="italic" font-size="3.6" fill="#2e4630" text-anchor="middle">Món quà quê — gửi trọn tấm lòng</text>
  <text x="50" y="95" font-family="Cambria, Georgia, serif" font-style="italic" font-size="3.6" fill="#2e4630" text-anchor="middle">đầu năm mới.</text>

  <!-- Khoảng trống lớn phía dưới - CHỦ ĐỊNH để trống, không vẽ gì - dành cảm giác "nhẹ nhàng, có
  chỗ thở" cho mặt trước; lời nhắn viết tay thật nằm ở MẶT SAU (giấy trơn, không in gì). -->

  <line x1="20" y1="133" x2="80" y2="133" stroke="#2e4630" stroke-width="0.3" opacity="0.4"/>
  <text x="50" y="139" font-family="Arial, sans-serif" font-size="3" fill="#3a2f18" text-anchor="middle">Zalo: 0979 502 000</text>
  <text x="50" y="144.5" font-family="Arial, sans-serif" font-size="3" fill="#3a2f18" text-anchor="middle">nongsannhalam.com</text>
</svg>
